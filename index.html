<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DIVERA Mailalert zu CSV</title>
    <link rel="stylesheet" href="styles.css?v=0.1.3">
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div class="app-title">
          <img class="app-logo" src="docs/logo.png" alt="" width="56" height="56">
          <div class="app-title-copy">
            <p class="eyebrow">DIVERA 24/7</p>
            <h1>Mailalert Parser</h1>
          </div>
        </div>
        <p class="privacy-note">Verarbeitung lokal im Browser</p>
      </header>

      <section class="workspace" aria-label="EML-Dateien importieren">
        <div class="dropzone" id="dropzone" tabindex="0">
          <input class="file-input" id="file-input" type="file" accept=".eml,message/rfc822" multiple>
          <div class="dropzone-icon" aria-hidden="true">
            <span></span>
          </div>
          <div class="dropzone-copy">
            <h2>EML-Dateien hier ablegen</h2>
            <p>oder Dateien auswählen</p>
          </div>
          <label class="button secondary" for="file-input">Dateien auswählen</label>
        </div>

        <div class="action-bar">
          <div class="selection-summary" id="selection-summary">Keine Dateien ausgewählt</div>
          <button class="button primary" id="parse-button" type="button" disabled>Parsing starten</button>
        </div>

        <section class="panel" aria-label="Ausgewählte Dateien">
          <div class="panel-heading">
            <h2>Ausgewählte Dateien</h2>
            <button class="text-button" id="clear-button" type="button" disabled>Leeren</button>
          </div>
          <ul class="file-list" id="file-list"></ul>
        </section>

        <section class="panel results-panel" aria-label="Parsing-Ergebnisse">
          <div class="panel-heading">
            <h2>Ergebnisse</h2>
            <div class="result-heading-actions">
              <span class="result-count" id="result-count">0 verarbeitet</span>
              <button class="button secondary download-button" id="download-csv-button" type="button" disabled>CSV herunterladen</button>
            </div>
          </div>
          <div class="result-tools" aria-label="Ergebnisse filtern">
            <label class="field">
              <span>Suche</span>
              <input id="result-search" type="search" placeholder="In Ergebnissen suchen" disabled>
            </label>
            <label class="field compact">
              <span>Status</span>
              <select id="status-filter" disabled>
                <option value="all">Alle</option>
                <option value="ok">Erfolgreich</option>
                <option value="error">Fehler</option>
              </select>
            </label>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th><button class="sort-button" type="button" data-sort-key="source_file" disabled>Datei <span class="sort-indicator" aria-hidden="true"></span></button></th>
                  <th><button class="sort-button" type="button" data-sort-key="status" disabled>Status <span class="sort-indicator" aria-hidden="true"></span></button></th>
                  <th><button class="sort-button" type="button" data-sort-key="datum" disabled>Datum <span class="sort-indicator" aria-hidden="true"></span></button></th>
                  <th><button class="sort-button" type="button" data-sort-key="einsatzstichwort" disabled>Einsatzstichwort <span class="sort-indicator" aria-hidden="true"></span></button></th>
                  <th><button class="sort-button" type="button" data-sort-key="ort" disabled>Ort <span class="sort-indicator" aria-hidden="true"></span></button></th>
                  <th><button class="sort-button" type="button" data-sort-key="priority" disabled>Priorität <span class="sort-indicator" aria-hidden="true"></span></button></th>
                  <th>Alarmtext</th>
                  <th><button class="sort-button" type="button" data-sort-key="einheit" disabled>Einheit <span class="sort-indicator" aria-hidden="true"></span></button></th>
                  <th><button class="sort-button" type="button" data-sort-key="verfasser" disabled>Verfasser <span class="sort-indicator" aria-hidden="true"></span></button></th>
                </tr>
              </thead>
              <tbody id="results-body">
                <tr class="empty-row">
                  <td colspan="9">Noch keine Ergebnisse</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </section>
    </main>

    <footer class="app-footer">
      <div class="footer-meta" aria-label="Versionsinformationen">
        <span>HTML v0.1.3</span>
        <span id="js-version">JS v...</span>
      </div>
      <p class="footer-credit">
        developed with ❤️ by <a href="https://github.com/micha-k">micha-k</a>
      </p>
    </footer>

    <script type="module" src="app.mjs?v=0.1.3"></script>
  </body>
</html>
